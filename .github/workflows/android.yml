name: Build BrainVita

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The release key lives in the repository secrets (see README). Without it the build falls back
      # to a throwaway debug key, and the phone must uninstall the previous build before installing.
      - name: Unpack the signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.BRAINVITA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BRAINVITA_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=release key" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::BRAINVITA_KEYSTORE_B64 secret is not set: signing with a debug key"
            echo "signed=debug key (add the BRAINVITA_* secrets to sign with the release key)" >> "$GITHUB_OUTPUT"
          fi

      # Unit tests (board, jumps, win/lose, undo, saved games) and the app builds.
      # --continue reports every compile error and test failure in one run.
      - name: Unit tests and build
        env:
          BRAINVITA_VERSION_CODE: ${{ github.run_number }}
          BRAINVITA_KEYSTORE_PASSWORD: ${{ secrets.BRAINVITA_KEYSTORE_PASSWORD }}
          BRAINVITA_KEY_ALIAS: ${{ secrets.BRAINVITA_KEY_ALIAS }}
          BRAINVITA_KEY_PASSWORD: ${{ secrets.BRAINVITA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --continue :core:test assembleRelease assembleDebug assembleDebugAndroidTest

      - name: Name the app file
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/BrainVita.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/BrainVita-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk out/BrainVita-androidTest.apk

      - name: Bundle the unit test report
        if: always()
        run: zip -qr unit-tests.zip core/build/reports/tests || true

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/

      - name: Publish the build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BrainVita (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            Install BrainVita.apk on the phone. Signed with the ${{ steps.key.outputs.signed }}.
            Builds signed with the release key install straight over the previous build.
          files: |
            out/BrainVita.apk
            unit-tests.zip
          prerelease: true

  # On an emulator: launch the real release APK and walk the game with the screen test, saving
  # screenshots, at the Fold's cover-screen size and its inner-screen size.
  device-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        screen: [cover-screen, inner-screen]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/device-tests.sh "${{ runner.temp }}/apk" "${{ runner.temp }}/results" ${{ matrix.screen }}

      - name: Bundle the results
        if: always()
        run: cd "${{ runner.temp }}" && zip -qr test-results-${{ matrix.screen }}.zip results

      - name: Publish the results
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          # A release of its own: adding files to the build's release from here is refused by GitHub
          # ("Resource not accessible by integration") once that release exists.
          tag_name: build-${{ github.run_number }}-${{ matrix.screen }}
          name: Screenshots (build ${{ github.run_number }}, ${{ matrix.screen }})
          target_commitish: ${{ github.sha }}
          files: ${{ runner.temp }}/test-results-${{ matrix.screen }}.zip
          prerelease: true
